server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful
spring:
  application:
    name: dlq-replay-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${REPLAY_DB_URL}
    username: ${REPLAY_DB_USER}
    password: ${REPLAY_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${REPLAY_DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.truststore.type: ${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      ssl.keystore.type: ${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
      ssl.key.password: ${KAFKA_SSL_KEY_PASSWORD:}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/banking}
app:
  replay:
    # Used only for legacy DLQ records created before x-original-topic provenance was added.
    # New DLQ records are replayed to the exact original RAW topic recorded in the DLQ header.
    legacy-target-topic-pattern: ${APP_REPLAY_LEGACY_TARGET_TOPIC_PATTERN:raw-payments-%s}
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
