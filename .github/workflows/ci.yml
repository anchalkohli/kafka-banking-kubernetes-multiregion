name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mq-ingestion-service, kafka-processor-service, dlq-replay-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: mvn -B test
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        shell: bash
        run: |
          case "${{ matrix.service }}" in
            mq-ingestion-service) echo "name=kafka-banking-mq-ingestion" >> "$GITHUB_OUTPUT" ;;
            kafka-processor-service) echo "name=kafka-banking-processor" >> "$GITHUB_OUTPUT" ;;
            dlq-replay-service) echo "name=kafka-banking-dlq-replay" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.image.outputs.name }}:main
  validate-kustomize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Render all regional overlays
        run: |
          kustomize build k8s/overlays/emea >/tmp/emea.yaml
          kustomize build k8s/overlays/nam >/tmp/nam.yaml
          kustomize build k8s/overlays/aspac >/tmp/aspac.yaml
          kustomize build k8s/platform >/tmp/platform.yaml
