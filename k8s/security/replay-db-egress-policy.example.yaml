apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dlq-replay-to-ha-postgres
  namespace: banking
spec:
  podSelector:
    matchLabels:
      app: dlq-replay
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.0/32 # REPLACE with the smallest approved regional HA PostgreSQL CIDR
      ports:
        - protocol: TCP
          port: 5432
