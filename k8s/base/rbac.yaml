apiVersion: v1
kind: ServiceAccount
metadata:
  name: banking-app
  namespace: banking
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: banking-app-read-config
  namespace: banking
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: banking-app-read-config
  namespace: banking
subjects:
  - kind: ServiceAccount
    name: banking-app
    namespace: banking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: banking-app-read-config
