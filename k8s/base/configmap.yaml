apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
  namespace: banking
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APP_KAFKA_REGION: REGION
  APP_KAFKA_RAW_TOPIC: raw-payments-region
  APP_KAFKA_OUTPUT_TOPIC: json-payments-region
  APP_KAFKA_DLQ_TOPIC: dlq-payments-region
  KAFKA_CONSUMER_GROUP: payment-processor-region

  # Local/default transport profile. Production regional overlays should replace
  # this with SSL or SASL_SSL and provide the corresponding banking-tls secret.
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_SASL_MECHANISM: PLAIN

  IBM_MQ_QUEUE_MANAGER: QM1
  IBM_MQ_CHANNEL: DEV.APP.SVRCONN
  IBM_MQ_CONN_NAME: ibm-mq-region:1414
  IBM_MQ_QUEUE: PAYMENT.QUEUE.REGION
  IBM_MQ_SSL_ENABLED: "false"
  IBM_MQ_SSL_FIPS_REQUIRED: "false"
  IBM_MQ_SSL_TRUSTSTORE_TYPE: PKCS12
  IBM_MQ_SSL_KEYSTORE_TYPE: PKCS12
