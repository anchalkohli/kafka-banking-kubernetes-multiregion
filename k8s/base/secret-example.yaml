apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
  namespace: banking
type: Opaque
stringData:
  # Example values only. Do not commit real production credentials.
  IBM_MQ_USER: app
  IBM_MQ_PASSWORD: change-me
  IBM_MQ_SSL_TRUSTSTORE_PASSWORD: change-me
  IBM_MQ_SSL_KEYSTORE_PASSWORD: change-me
  KAFKA_SSL_TRUSTSTORE_PASSWORD: change-me
  KAFKA_SSL_KEYSTORE_PASSWORD: change-me
  KAFKA_SSL_KEY_PASSWORD: change-me
  # Required only when SASL is selected. Prefer SCRAM/OAUTH or bank-approved mechanism.
  KAFKA_SASL_JAAS_CONFIG: ""
