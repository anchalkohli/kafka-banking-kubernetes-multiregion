apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: banking
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: banking
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/part-of: kafka-banking
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: grafana-admin-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
